name: Android Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973'
      - name: Build tag version without signing credentials
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/build-release.sh --unsigned "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-unsigned
          path: app-android/build/outputs/apk/release/app-android-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign and verify APK
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Environment secrets are restricted to v* tags in the repository settings.
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install signing tools
        run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release-unsigned
          path: app-android/build/outputs/apk/release
      - name: Sign with the private release key
        env:
          WSDX233_KEYSTORE_BASE64: ${{ secrets.WSDX233_KEYSTORE_BASE64 }}
          WSDX233_KEY_PASSWORD: ${{ secrets.WSDX233_KEY_PASSWORD }}
          WSDX233_KEYSTORE_PATH: ${{ runner.temp }}/wawlink-signing/wsdx233.keystore
        run: |
          set +x
          set -euo pipefail
          umask 077
          test -n "$WSDX233_KEYSTORE_BASE64" && test -n "$WSDX233_KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/wawlink-signing"
          trap 'rm -rf -- "$RUNNER_TEMP/wawlink-signing"' EXIT
          printf '%s' "$WSDX233_KEYSTORE_BASE64" | base64 --decode > "$WSDX233_KEYSTORE_PATH"
          unset WSDX233_KEYSTORE_BASE64
          ./scripts/sign-release.sh
      - name: Remove private signing material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/wawlink-signing"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-signed
          path: |
            app-android/build/outputs/apk/release/app-android-release.apk
            app-android/build/outputs/apk/release/app-android-release.apk.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release-signed
          path: release
      - name: Verify download checksum
        working-directory: release
        run: sha256sum --check app-android-release.apk.sha256
      - name: Publish signed APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/app-android-release.apk release/app-android-release.apk.sha256 \
            --verify-tag --title "WawLink $RELEASE_TAG" --generate-notes
